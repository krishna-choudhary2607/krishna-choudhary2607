name: Update profile assets

on:
  schedule:
    - cron: "15 0 * * *"
  push:
    paths:
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=tokyonight&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate First Website pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=First-Website&theme=tokyonight&hide_border=true
          path: profile/pin-first-website.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Cafe Havana pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cafe-havana-site&theme=tokyonight&hide_border=true
          path: profile/pin-cafe-havana-site.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-contribution-snake.svg?color_snake=%2370a5fd&color_dots=%23161b22%2C%230e4429%2C%23006d32%2C%2326a641%2C%2339d353
            profile/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%2370a5fd

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile assets"
          git pull --rebase origin main
          git push origin HEAD:main
